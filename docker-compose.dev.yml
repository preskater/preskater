services:
  db:
    image: postgres:17-alpine
    container_name: preskater-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: preskater
      POSTGRES_PASSWORD: preskater
      POSTGRES_DB: preskater
    ports:
      - "5433:5432"
    volumes:
      - preskater-postgres-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preskater -d preskater"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://preskater:preskater@db:5432/preskater
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    # DATABASE_URL points at the compose service, not the host-published port.
    # `environment` takes precedence over `env_file`, so this wins over .env.
    environment:
      DATABASE_URL: postgresql://preskater:preskater@db:5432/preskater
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      # Bind-mount the source for hot reload, but keep the container's
      # node_modules (native/platform-specific) and .next out of it.
      - .:/app
      - /app/node_modules
      - /app/.next
      - /app/src/generated
    restart: unless-stopped

volumes:
  preskater-postgres-data-dev:
