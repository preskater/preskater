services:
  db:
    image: postgres:17-alpine
    container_name: preskater-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: preskater
      POSTGRES_PASSWORD: preskater
      POSTGRES_DB: preskater
    ports:
      # Host port 5433 to avoid clashing with a local PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - preskater-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preskater -d preskater"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  preskater-postgres-data:
